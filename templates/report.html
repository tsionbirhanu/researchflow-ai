<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<style>
  body { margin: 0; padding: 0; background: #ffffff; color: #1f2933; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-size: 16px; line-height: 1.6; }
  .wrap { max-width: 720px; margin: 0 auto; padding: 32px 24px; }
  .label { font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: #52606d; }
  h1 { font-size: 28px; line-height: 1.25; margin: 6px 0 8px; color: #102a43; }
  .meta { font-size: 14px; color: #52606d; margin: 0 0 16px; }
  .badge { display: inline-block; padding: 4px 12px; border-radius: 999px; font-size: 13px; font-weight: 600; }
  .badge.high { background: #e3f9e5; color: #1f7a33; border: 1px solid #a3d9a5; }
  .badge.medium { background: #fff7e0; color: #8a5a00; border: 1px solid #f0c96b; }
  .badge.low { background: #ffe8e8; color: #a61b1b; border: 1px solid #f2a7a7; }
  .verdict { font-size: 13px; color: #52606d; margin: 8px 0 0; }
  h2 { font-size: 21px; color: #102a43; margin: 32px 0 10px; padding-bottom: 6px; border-bottom: 1px solid #e4e7eb; }
  h3 { font-size: 17px; color: #243b53; margin: 22px 0 6px; }
  p { margin: 0 0 12px; }
  ul, ol { padding-left: 22px; margin: 0 0 12px; }
  li { margin: 0 0 6px; }
  a { color: #1d4ed8; }
  .card { background: #f0f4f8; border-left: 4px solid #334e68; border-radius: 6px; padding: 4px 20px 12px; margin: 24px 0; page-break-inside: avoid; break-inside: avoid; }
  .card h2 { border-bottom: none; margin-top: 14px; }
  sup.cite { font-size: 11px; line-height: 0; }
  sup.cite a { text-decoration: none; }
  .sources-heading ~ ol li { font-size: 14px; word-break: break-word; }
  .footer { margin-top: 40px; padding-top: 14px; border-top: 1px solid #e4e7eb; font-size: 12px; color: #7b8794; }
  @media (max-width: 600px) { .wrap { padding: 20px 16px; } h1 { font-size: 23px; } }
  @media print {
    .wrap { max-width: none; padding: 0; }
    a { color: #1f2933; }
    h2, h3 { page-break-after: avoid; break-after: avoid; }
    li, p { orphans: 3; widows: 3; }
  }
</style>
</head>
<body style="margin:0;background:#ffffff;">
<div class="wrap" style="max-width:720px;margin:0 auto;padding:32px 24px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;font-size:16px;line-height:1.6;color:#1f2933;">
  <div class="label">AI Research Pipeline</div>
  <h1>{{title}}</h1>
  <p class="meta">Generated on {{date}} · {{source_count}} sources · {{style}} · {{depth}}</p>
  <span class="badge {{badge_class}}">Confidence: {{confidence}}</span>
  <p class="verdict">{{verdict_note}}</p>

  {{content}}

  <div class="footer">Generated automatically by AI Research Pipeline. Verify important facts with the original sources.</div>
</div>
</body>
</html>
